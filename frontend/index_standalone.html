<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIGHNA - AI-Powered Smart Logistics & Accessibility Intelligence for NER</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- React & Babel for Standalone Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-surface: #121824;
      --bg-card: rgba(22, 30, 46, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(59, 130, 246, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: var(--font-heading); }
    .app-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .sidebar { width: 260px; background: rgba(15, 21, 33, 0.95); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); }
    .logo-badge { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
    .brand-name { font-size: 1.25rem; font-weight: 800; background: linear-gradient(to right, #ffffff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-sub { font-size: 0.65rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; text-decoration: none; }
    .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
    .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.1)); color: var(--accent-cyan); border-left: 3px solid var(--accent-cyan); }
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(circle at 50% 0%, #172033 0%, #0a0d14 70%); }
    .top-navbar { height: 64px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(15, 21, 33, 0.7); backdrop-filter: blur(8px); }
    .page-title { font-size: 1.2rem; font-weight: 700; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-blue), #2563eb); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4); }
    .content-body { flex: 1; padding: 24px; overflow-y: auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; backdrop-filter: blur(8px); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 800; font-family: var(--font-heading); }
    .glass-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; backdrop-filter: blur(12px); margin-bottom: 24px; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.88rem; }
    .data-table th { text-align: left; padding: 12px 16px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); text-transform: uppercase; font-size: 0.75rem; }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .badge-low { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-critical { background: rgba(225, 29, 72, 0.25); color: #fda4af; border: 1px solid rgba(225, 29, 72, 0.5); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; background: rgba(10, 13, 20, 0.6); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 0.9rem; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: #111726; border: 1px solid var(--border-glow); border-radius: 16px; width: 90%; max-width: 650px; padding: 24px; max-height: 85vh; overflow-y: auto; }
    #map-root { width: 100%; height: 500px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = 'http://localhost:8000/api';

    async function apiFetch(endpoint, options = {}) {
      const res = await fetch(`${API_BASE}${endpoint}`, options);
      return res.json();
    }

    function App() {
      const [activePage, setActivePage] = useState('dashboard');
      const [summary, setSummary] = useState({ active_incidents: 2, high_risk_corridors: 3, blocked_roads: 1, vehicles_rerouted: 0, pending_verifications: 1 });
      const [roadsGeoJSON, setRoadsGeoJSON] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [vehicles, setVehicles] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [demoLogs, setDemoLogs] = useState([]);

      const loadData = async () => {
        try {
          const [s, r, i, v, a] = await Promise.all([
            apiFetch('/dashboard/summary'),
            apiFetch('/map/roads'),
            apiFetch('/incidents'),
            apiFetch('/vehicles'),
            apiFetch('/alerts')
          ]);
          setSummary(s);
          setRoadsGeoJSON(r);
          setIncidents(i);
          setVehicles(v);
          setAlerts(a);
        } catch (e) {
          console.warn('API error:', e);
        }
      };

      useEffect(() => {
        loadData();
        const interval = setInterval(loadData, 8000);
        return () => clearInterval(interval);
      }, []);

      const runDemo = async () => {
        try {
          const res = await apiFetch('/demo/run-scenario', { method: 'POST' });
          setDemoLogs(res.execution_steps || []);
          loadData();
        } catch (e) {
          alert('Demo Error: ' + e.message);
        }
      };

      return (
        <div className="app-container">
          {/* Sidebar */}
          <aside className="sidebar">
            <div className="sidebar-header">
              <div className="logo-badge">A</div>
              <div>
                <div className="brand-name">AVIGHNA</div>
                <div className="brand-sub">NER Logistics Platform</div>
              </div>
            </div>
            <nav className="sidebar-nav">
              <a className={`nav-item ${activePage==='dashboard'?'active':''}`} onClick={() => setActivePage('dashboard')}>📊 Dashboard</a>
              <a className={`nav-item ${activePage==='map'?'active':''}`} onClick={() => setActivePage('map')}>🗺️ Live GIS Map</a>
              <a className={`nav-item ${activePage==='incidents'?'active':''}`} onClick={() => setActivePage('incidents')}>⚠️ Incidents</a>
              <a className={`nav-item ${activePage==='risk'?'active':''}`} onClick={() => setActivePage('risk')}>⚡ AI Risk Engine</a>
              <a className={`nav-item ${activePage==='vehicles'?'active':''}`} onClick={() => setActivePage('vehicles')}>🚛 Fleet Tracking</a>
              <a className={`nav-item ${activePage==='routes'?'active':''}`} onClick={() => setActivePage('routes')}>🧭 Route Planner</a>
              <a className={`nav-item ${activePage==='alerts'?'active':''}`} onClick={() => setActivePage('alerts')}>🔔 Warnings</a>
              <a className={`nav-item ${activePage==='verification'?'active':''}`} onClick={() => setActivePage('verification')}>✅ Verifier Console</a>
            </nav>
          </aside>

          {/* Main Content */}
          <div className="main-wrapper">
            <header className="top-navbar">
              <div className="page-title">AVIGHNA Operational Command Center</div>
              <button className="btn-primary" style={{ background: 'linear-gradient(135deg, #10b981, #059669)' }} onClick={() => setIsModalOpen(true)}>
                ▶ RUN DEMO SCENARIO
              </button>
            </header>

            <main className="content-body">
              {/* Dashboard View */}
              {activePage === 'dashboard' && (
                <div>
                  <div className="stats-grid">
                    <div className="stat-card"><div className="stat-header">Active Incidents</div><div className="stat-value" style={{color:'#f43f5e'}}>{summary.active_incidents}</div></div>
                    <div className="stat-card"><div className="stat-header">High Risk Corridors</div><div className="stat-value" style={{color:'#f59e0b'}}>{summary.high_risk_corridors}</div></div>
                    <div className="stat-card"><div className="stat-header">Blocked Roads</div><div className="stat-value" style={{color:'#ef4444'}}>{summary.blocked_roads}</div></div>
                    <div className="stat-card"><div className="stat-header">Vehicles Rerouted</div><div className="stat-value" style={{color:'#3b82f6'}}>{summary.vehicles_rerouted}</div></div>
                    <div className="stat-card"><div className="stat-header">Pending Verifications</div><div className="stat-value" style={{color:'#8b5cf6'}}>{summary.pending_verifications}</div></div>
                  </div>

                  <div className="glass-panel">
                    <h3 style={{marginBottom:'12px'}}>Live GIS Accessibility Map</h3>
                    <LeafletMapView roadsGeoJSON={roadsGeoJSON} incidents={incidents} vehicles={vehicles} />
                  </div>

                  <div className="glass-panel">
                    <h3 style={{marginBottom:'12px'}}>Live Warnings Stream</h3>
                    {alerts.map(a => (
                      <div key={a.id} style={{padding:'10px', background:'rgba(15,23,42,0.6)', borderRadius:'8px', marginBottom:'8px', borderLeft:'3px solid #f59e0b'}}>
                        <strong>{a.alert_type}</strong>: {a.message}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Incidents View */}
              {activePage === 'incidents' && (
                <div className="glass-panel">
                  <h3>Reported Field Incidents</h3>
                  <table className="data-table">
                    <thead><tr><th>ID</th><th>Type</th><th>Severity</th><th>District</th><th>Status</th><th>AI Risk</th></tr></thead>
                    <tbody>
                      {incidents.map(i => (
                        <tr key={i.id}>
                          <td>#{i.id}</td>
                          <td>{i.incident_type}</td>
                          <td><span className="badge badge-high">{i.severity}</span></td>
                          <td>{i.district}</td>
                          <td><span className="badge badge-low">{i.verification_status}</span></td>
                          <td><strong>{i.risk_score}/100</strong></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* Fleet View */}
              {activePage === 'vehicles' && (
                <div className="glass-panel">
                  <h3>Logistics Fleet GPS Tracking</h3>
                  <table className="data-table">
                    <thead><tr><th>Vehicle No</th><th>Cargo</th><th>Priority</th><th>Destination</th><th>Status</th><th>ETA</th></tr></thead>
                    <tbody>
                      {vehicles.map(v => (
                        <tr key={v.id}>
                          <td style={{color:'#38bdf8', fontWeight:'bold'}}>{v.vehicle_number}</td>
                          <td>{v.cargo_type}</td>
                          <td><span className="badge badge-critical">{v.priority}</span></td>
                          <td>{v.destination}</td>
                          <td><span className="badge badge-low">{v.status}</span></td>
                          <td><strong>{v.eta}</strong></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* AI Risk Engine View */}
              {activePage === 'risk' && <RiskEngineView />}
            </main>
          </div>

          {/* Demo Modal */}
          {isModalOpen && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div style={{display:'flex', justifyContent:'space-between', marginBottom:'16px'}}>
                  <h2>End-to-End Demo Workflow</h2>
                  <button onClick={() => setIsModalOpen(false)} style={{background:'none', border:'none', color:'#fff', cursor:'pointer'}}>✕</button>
                </div>
                <button className="btn-primary" style={{width:'100%', justifyContent:'center', padding:'12px', background:'linear-gradient(135deg, #10b981, #059669)'}} onClick={runDemo}>
                  ▶ Start Live Demo Simulation
                </button>
                {demoLogs.length > 0 && (
                  <div style={{marginTop:'16px'}}>
                    <h4>Simulation Audit Log:</h4>
                    {demoLogs.map((step, idx) => (
                      <div key={idx} style={{padding:'10px', background:'rgba(15,23,42,0.8)', borderRadius:'8px', marginTop:'8px', borderLeft:'3px solid #10b981'}}>
                        <strong>STEP {step.step}: {step.title}</strong>
                        <p style={{fontSize:'0.85rem', color:'#94a3b8'}}>{step.detail}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function LeafletMapView({ roadsGeoJSON, incidents, vehicles }) {
      const mapRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current) {
          const map = L.map('map-root').setView([25.90, 91.88], 8);
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
          }).addTo(map);
          mapRef.current = map;
        }

        const map = mapRef.current;
        if (roadsGeoJSON && roadsGeoJSON.features) {
          L.geoJSON(roadsGeoJSON, {
            style: (feature) => ({
              color: feature.properties.accessibility_status === 'BLOCKED' ? '#f43f5e' : feature.properties.accessibility_status === 'RISKY' ? '#f59e0b' : '#10b981',
              weight: 4
            })
          }).addTo(map);
        }

        if (incidents) {
          incidents.forEach(inc => {
            L.marker([inc.latitude, inc.longitude]).addTo(map).bindPopup(`<b>${inc.incident_type}</b><br/>Severity: ${inc.severity}`);
          });
        }
      }, [roadsGeoJSON, incidents]);

      return <div id="map-root"></div>;
    }

    function RiskEngineView() {
      const [rain, setRain] = useState(85);
      const [slope, setSlope] = useState(34);
      const [result, setResult] = useState(null);

      const predict = async () => {
        const res = await apiFetch('/risk/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ latitude: 26.14, longitude: 91.73, rainfall: parseFloat(rain), slope: parseFloat(slope), road_condition: 'POOR' })
        });
        setResult(res);
      };

      return (
        <div className="glass-panel">
          <h3>AI Topographical & Precipitation Risk Engine</h3>
          <div className="form-group" style={{marginTop:'16px'}}>
            <label className="form-label">Precipitation / Rainfall (mm / 24h)</label>
            <input type="number" className="form-input" value={rain} onChange={e => setRain(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Slope Gradient (Degrees °)</label>
            <input type="number" className="form-input" value={slope} onChange={e => setSlope(e.target.value)} />
          </div>
          <button className="btn-primary" onClick={predict}>Calculate ML Risk Score</button>
          {result && (
            <div style={{marginTop:'20px', padding:'16px', background:'rgba(15,23,42,0.8)', borderRadius:'12px'}}>
              <h2>Risk Score: <span style={{color: result.risk_score > 70 ? '#f43f5e' : '#10b981'}}>{result.risk_score} / 100</span> ({result.risk_level})</h2>
              <p style={{marginTop:'8px', color:'#60a5fa'}}>Action: {result.recommended_action}</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
