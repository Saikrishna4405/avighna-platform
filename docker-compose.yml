version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: avighna_postgis
    environment:
      POSTGRES_DB: avighna_db
      POSTGRES_USER: avighna_user
      POSTGRES_PASSWORD: avighna_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avighna_user -d avighna_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avighna_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://avighna_user:avighna_pass@postgres:5432/avighna_db
      - SECRET_KEY=avighna_super_secret_jwt_key_ner_logistics_platform
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avighna_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
